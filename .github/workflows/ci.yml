name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run --filter @unergy-dev/gandalf lint:package
      - run: bun run test:smoke
